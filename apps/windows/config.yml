groups:
  - id: general
    label: Windows
    description: Defina a versão, os recursos e as credenciais da máquina virtual do Windows.
    fields:
      - id: VERSION
        label: Versão do Windows
        type: enum
        default: "11"
        required: true
        options: ["11", "11l", "11e", "10", "10l", "10e", "8e", "7u", "vu", "xp", "2k", "me", "98", "95", "2025", "2022", "2019", "2016", "2012", "2008", "2003", "core11", "tiny11", "tiny10", "reactos"]
      - id: DISK_SIZE
        label: Tamanho do disco (ex.: 64G, 256G)
        type: string
        default: 64G
        required: true
      - id: RAM_SIZE
        label: Memória RAM (ex.: 4G, 8G, half, max)
        type: string
        default: 4G
        required: true
      - id: CPU_CORES
        label: Núcleos de CPU
        type: integer
        default: 2
        required: true
        min: 1
        max: 64
      - id: USERNAME
        label: Usuário do Windows
        type: string
        default: Docker
        required: true
      - id: PASSWORD
        label: Senha do Windows
        type: string
        default: admin
        required: true
      - id: LANGUAGE
        label: Idioma
        type: enum
        default: English
        required: true
        options: [Arabic, Bulgarian, Chinese, Croatian, Czech, Danish, Dutch, English, Estonian, Finnish, French, German, Greek, Hebrew, Hungarian, Italian, Japanese, Korean, Latvian, Lithuanian, Norwegian, Polish, Portuguese, Romanian, Russian, Serbian, Slovak, Slovenian, Spanish, Swedish, Thai, Turkish, Ukrainian]
      - id: REGION
        label: Região / formato regional (ex.: en-US, pt-BR)
        type: string
        default: en-US
        required: false
      - id: KEYBOARD
        label: Layout de teclado (ex.: en-US, pt-BR)
        type: string
        default: en-US
        required: false
      - id: HOST_RDP_PORT
        label: Porta externa do RDP no host (interna 3389)
        type: integer
        default: 3389
        required: false
        min: 1
        max: 65535
      - id: HOST_VNC_PORT
        label: Porta externa do VNC no host (interna 5900)
        type: integer
        default: 5900
        required: false
        min: 1
        max: 65535
      - id: COMMAND
        label: Comando executado no final da instalação (ex.: reg add "HKLM\Software\Exemplo" /v Enabled /t REG_DWORD /d 1 /f)
        type: string
        default: ""
        required: false
