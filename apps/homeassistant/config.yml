groups:
  - id: general
    label: Home Assistant
    description: Escolha a tag da imagem e o fuso horário usado pelas automações e pelo histórico.
    fields:
      - id: CONTAINER_NAME
        label: Nome do container / instância (define a pasta em /opt/container-apps)
        type: string
        default: homeassistant-1
        required: true
        hint: Pode ser alterado na hora de criar o container; cada nome gera uma instância independente.
      - id: TAG
        label: Versão / tag da imagem
        type: enum
        default: stable
        required: true
        options: [stable, beta, dev]
      - id: TZ
        label: Fuso horário (ex.: America/Sao_Paulo, UTC)
        type: string
        default: America/Sao_Paulo
        required: true
