services:
  server:
    image: snowdreamtech/frps:latest
    # O nome da instância vem do .env; o sufixo separa os perfis server/client.
    container_name: ${CONTAINER_NAME:-frp-tunnel-1}-server
    restart: "no"
    network_mode: host
    profiles: ["server"]
    volumes:
      - ./data:/etc/frp
      - ./logs:/var/log/frp
    environment:
      - FRP_BIND_ADDR=${FRP_BIND_ADDR:-0.0.0.0}
      - FRP_BIND_PORT=${FRP_BIND_PORT:-7000}
      - FRP_TOKEN=${FRP_TOKEN:-changeme}

  client:
    image: snowdreamtech/frpc:latest
    # O nome da instância vem do .env; o sufixo separa os perfis server/client.
    container_name: ${CONTAINER_NAME:-frp-tunnel-1}-client
    restart: "no"
    network_mode: host
    profiles: ["client"]
    volumes:
      - ./data:/etc/frp
      - ./logs:/var/log/frp
    environment:
      - FRP_TOKEN=${FRP_TOKEN:-changeme}