name: FRP Tunnel
package_name: frp-tunnel
version: latest
upstream_version: latest
description: FRP Tunnel para criar túneis seguros.
long_description: |
  Este aplicativo permite criar túneis seguros para acessar serviços internos de forma remota. Ideal para desenvolvedores, administradores de sistemas e entusiastas de redes que desejam expor serviços internos sem comprometer a segurança.
homepage: https://github.com/fatedier/frp
maintainer: Container Apps Store
license: Apache-2.0
tags:
  - role::container-app
  - implemented-in::docker
  - category::network
debian_section: web
architecture: all
web_ui:
  enabled: false
  path: /
  port: 0
  protocol: http
default_config:
  FRP_MODE: server
  FRP_BIND_ADDR: 0.0.0.0
  FRP_BIND_PORT: "7000"
  FRP_TOKEN: changeme
