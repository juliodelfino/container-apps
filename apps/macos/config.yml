groups:
  - id: general
    label: macOS
    description: Escolha a versão do macOS, os recursos e as portas VNC/SSH da VM.
    fields:
      - id: CONTAINER_NAME
        label: Nome do container / instância (define a pasta em /opt/container-apps)
        type: string
        default: macos-1
        required: true
        hint: Pode ser alterado na hora de criar o container; cada nome gera uma instância independente.
      - id: SHORTNAME
        label: Versão do macOS (Docker-OSX)
        type: enum
        default: sequoia
        required: true
        options: [sequoia, sonoma, ventura, monterey, big-sur, catalina, mojave, high-sierra]
      - id: RAM
        label: Memória RAM da VM (em GB)
        type: integer
        default: 4
        required: true
        min: 3
        max: 128
      - id: SMP
        label: CPUs virtuais (SMP)
        type: integer
        default: 1
        required: true
        min: 1
        max: 64
      - id: CORES
        label: Núcleos por socket
        type: integer
        default: 1
        required: true
        min: 1
        max: 64
      - id: HOST_VNC_PORT
        label: Porta local do VNC no host (interna 5999)
        type: integer
        default: 8888
        required: true
        min: 1024
        max: 65535
      - id: HOST_SSH_PORT
        label: Porta SSH da VM no host (interna 10022)
        type: integer
        default: 50922
        required: true
        min: 1
        max: 65535
      - id: ARGUMENTS
        label: Argumentos extras do QEMU (Docker-OSX EXTRA)
        type: string
        default: ""
        required: false
