groups:
  - id: general
    label: macOS
    description: Escolha a versão, o modelo e os recursos da máquina virtual do macOS.
    fields:
      - id: CONTAINER_NAME
        label: Nome do container / instância (define a pasta em /opt/container-apps)
        type: string
        default: macos-1
        required: true
        hint: Pode ser alterado na hora de criar o container; cada nome gera uma instância independente.
      - id: VERSION
        label: Versão do macOS
        type: enum
        default: "15"
        required: true
        options: ["15", "14", "13", "12", "11"]
      - id: MODEL
        label: Modelo do Mac usado pelo OpenCore (ex.: iMacPro1,1)
        type: string
        default: iMacPro1,1
        required: false
      - id: DISK_SIZE
        label: Tamanho do disco (ex.: 64G, 128G)
        type: string
        default: 64G
        required: true
      - id: RAM_SIZE
        label: Memória RAM (ex.: 4G, 8G, half, max)
        type: string
        default: 4G
        required: true
      - id: CPU_CORES
        label: Núcleos de CPU
        type: integer
        default: 1
        required: true
        min: 1
        max: 64
      - id: HOST_VNC_PORT
        label: Porta externa do VNC no host (interna 5900)
        type: integer
        default: 5900
        required: false
        min: 1
        max: 65535
      - id: ARGUMENTS
        label: Argumentos extras do QEMU (ex.: -device usb-tablet)
        type: string
        default: ""
        required: false
