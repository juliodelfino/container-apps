name: macOS
package_name: macos
version: latest
upstream_version: "6.0"
description: Máquina virtual macOS baseada no Docker-OSX, acessível por VNC.
long_description: |
  Executa o Docker-OSX oficial com QEMU e aceleração por KVM. A imagem VNC é
  construída a partir do diretório vnc-version do projeto upstream. O disco da VM
  fica em ./macos/mac_hdd_ng.img e permanece salvo ao recriar o container.

  Acesse a tela com um cliente VNC em localhost:8888 (ou na porta configurada).
  A porta fica vinculada ao loopback porque o VNC não criptografa o tráfego; para
  acesso remoto, use um túnel SSH até o host. A senha VNC aleatória é exibida durante
  o build da imagem e também pode ser consultada dentro do container em
  /home/arch/OSX-KVM/vncpasswd_file. A porta 50922 encaminha SSH para a VM; habilite
  Acesso Remoto nas configurações do macOS para utilizá-la.

  Por padrão, a VM recebe 4 GB de RAM e 1 CPU virtual para limitar o consumo. A
  instalação da imagem VNC requer Docker Compose com suporte a builds de contexto Git,
  host Linux x86_64 com KVM (/dev/kvm) e pelo menos 50 GB livres para as imagens.

  Aviso: confira os termos de licença da Apple antes de instalar o macOS neste host.

homepage: https://github.com/sickcodes/Docker-OSX
maintainer: Container Apps Store
license: GPL-3.0-or-later
tags:
  - role::container-app
  - implemented-in::docker
  - use::virtualization
  - macos
  - vm
  - kvm
  - vnc
debian_section: misc
architecture: amd64
web_ui:
  enabled: false
  path: /
  port: 0
  protocol: http
default_config:
  SHORTNAME: sequoia
  RAM: "4"
  SMP: "1"
  CORES: "1"
  HOST_VNC_PORT: "8888"
  HOST_SSH_PORT: "50922"
  ARGUMENTS: ""
